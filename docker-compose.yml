# Bez EKUL_LOGIN/EKUL_PASSWORD usługa odświeżania nie startuje —
# aplikacja działa normalnie na danych już na dysku.
services:
  lecture_chooser:
    image: lecture-chooser:latest
    container_name: lecture_chooser
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: please-change-me
      # ulubione kierunki (kid ID, oddzielone przecinkami) — codziennie o 4:00
      # (favourite_refresh_hour w settings) trafiają do kolejki odświeżania;
      # działa tylko razem z EKUL_LOGIN/EKUL_PASSWORD
      FAVOURITE_KIDS: "6089"  # Informatyka II stopnia
      # v4: zapisy planów — retencja (dni bez otwarcia przed usunięciem,
      # domyślnie 120 = 4 miesiące) i limity anty-abuse
      RETENTION_DAYS: "120"
      MAX_SAVES: "20000"
      MAX_SAVES_PER_IP: "20"
      # Aplikacja stoi za Caddy (osobny kontener) — podaj adres/sieć, z
      # której Caddy łączy się z aplikacją (domyślna sieć Dockera to
      # 172.16.0.0/12); dopiero wtedy limity per-IP czytają prawdziwe IP
      # klienta z X-Forwarded-For (skrajnie prawy niezaufany wpis)
      TRUSTED_PROXY: "172.16.0.0/12"
      # Odkomentuj i ustaw, aby włączyć usługę odświeżania:
      # EKUL_LOGIN: twoj.login@kul.lublin.pl
      # EKUL_PASSWORD: twoje-haslo
    volumes:
      # trwałość zebranych danych między restartami kontenera
      - ./app/data/scraped:/lecture-chooser/app/data/scraped
      - ./app/data/exams.json:/lecture-chooser/app/data/exams.json:ro
      - ./app/data/events.json:/lecture-chooser/app/data/events.json:ro
      # v4: zapisy planów (SQLite WAL tworzy pliki poboczne — montujemy
      # katalog, nie pojedynczy plik)
      - ./app/data/saves:/lecture-chooser/app/data/saves
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
