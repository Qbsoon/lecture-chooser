<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Logowanie do e-KUL</title>
</head>
<body>
<!-- Fragment strony e-KUL /login.html (bez sesji), pobrany 2026-09-04.
     Formularz logowania: method=POST action=/login.html, pola:
     login (text), password (password), op=1 (hidden), js=0 (hidden; JS podmienia na 1),
     bfp (hidden; puste w HTML, wypełnia JS), post_kod (hidden; jednorazowy kod strony),
     submit "Zaloguj". Whitespace prettified. -->
<form action="/login.html" id="form_1788473614" method="POST">
<div class="col-sm-10 col-md-6 col-lg-6 col-xl-4 offset-md-3">
<div class="card-group">
<div class="card">
<div class="card-body">
<h2>Logowanie do e-KUL</h2>
<p class="text-muted">Serwis dla pracowników i studentów KUL</p>
<div class="input-group mb-3" style="margin-bottom: 10px;">
<div class="input-group-prepend">
<span class="input-group-text">
<i class="icon-user">
</i>
</span>
</div>
<input type="text" name="login" required="required" style="border-radius: 0;" class="form-control p-2" autofocus="autofocus" placeholder="Użytkownik">
</div>
<div class="input-group mb-3">
<div class="input-group-prepend">
<span class="input-group-text">
<i class="icon-lock">
</i>
</span>
</div>
<input type="password" name="password" required="required" style="border-radius: 0" class="form-control p-2" placeholder="Hasło">
<input type="hidden" name="op" value="1">
<input type="hidden" name="js" value="0">
<input type="hidden" name="bfp" id="bfp">
<input type="hidden" name="post_kod" value="121091040">
</div>
<div class="row" style="margin-top: 10px;">
<div class="col-6">
<button type="submit" class="btn btn-primary">Zaloguj</button>
</div>
<div class="col-6 text-right">
<a class="btn btn-link px-0" href="qlrpass.html">Odzyskaj hasło</a>
<br>
<a class="btn btn-link px-0" href="qlreg.html?lng=1">Załóż konto</a>
<br>
<a class="btn btn-link px-0" href="/login.html?s_lng=2">
<img src="img/flag/uk.png" alt="English version"> English version</a>
</div>
</div>
</div>
</div>
</div>
<br>
<span class="offline">UWAGA! nie należy odpisywać na żadne e-maile dotyczące weryfikacji danych (np. identyfikator, hasło) lub innych ważnych informacji.<br>CTC (dawniej DTI) nigdy nie prosi Państwa o podanie hasła.</span>
<div align="center" class="mt-3">
<a href="qlue.html">
<img src="gfx/public/logo_eu.png" width="1000" class="img-fluid" alt="Projekt EU">
</a>
</div>
</div>
</form>
</body>
</html>
